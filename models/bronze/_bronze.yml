version: 2

models:
  - name: brz_taxi_trips
    description: >
      Copie brute des fichiers sources, toutes colonnes en texte, noms de colonnes
      normalisés en snake_case. Colonnes techniques : filename (fichier d'origine)
      et _loaded_at (horodatage du chargement).
    columns:
      - name: trip_id
        description: "Identifiant de course tel que fourni par la source."
        data_tests:
          # Avertissement seulement : bronze accepte tout, les lignes sans
          # identifiant sont mises en quarantaine en silver (missing_trip_id).
          - not_null:
              config:
                severity: warn
